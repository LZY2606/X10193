<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>符号裁决庭</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div>
    <p class="eyebrow">Symbol Tribunal</p>
    <h1>符号裁决庭</h1>
    <p>在真正链接前解释每个未定义符号会选中谁。</p>
  </div>
  <button id="sampleBtn">生成示例方案</button>
</header>
<main>
  <section class="card upload">
    <h2>导入与策略</h2>
    <form id="uploadForm">
      <label>方案名称<input name="name" value="新方案" required></label>
      <label>平台策略<input name="policy" value="gnu"></label>
      <label class="check"><input type="checkbox" name="copyRelocation" checked> 允许 copy relocation</label>
      <label class="check"><input type="checkbox" name="copyProtected"> 允许 protected copy</label>
      <label class="files">ELF / archive（按选择顺序）<input type="file" name="files" multiple required></label>
      <button>创建不可变方案</button>
    </form>
  </section>

  <section class="card">
    <h2>方案</h2>
    <select id="schemeSelect"></select>
    <div id="schemeMeta" class="meta"></div>
  </section>

  <section class="grid">
    <article class="card">
      <h2>对象依赖</h2>
      <div id="modules"></div>
    </article>
    <article class="card">
      <h2>播放 archive 抽取与表更新</h2>
      <div class="controls">
        <button id="prevBtn">上一步</button>
        <button id="playBtn">播放</button>
        <button id="nextBtn">下一步</button>
        <span id="stepLabel"></span>
      </div>
      <ol id="events"></ol>
    </article>
  </section>

  <section class="card">
    <h2>符号候选与裁决</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>符号</th><th>结论</th><th>最终提供者</th><th>候选与淘汰原因</th><th>relocation</th><th>说明</th></tr></thead>
        <tbody id="resolutions"></tbody>
      </table>
    </div>
  </section>

  <section class="grid">
    <article class="card">
      <h2>版本图</h2>
      <svg id="versionGraph" width="100%" height="420" role="img"></svg>
    </article>
    <article class="card">
      <h2>语义比较</h2>
      <label>旧方案<select id="leftScheme"></select></label>
      <label>新方案<select id="rightScheme"></select></label>
      <button id="compareBtn">比较方案</button>
      <div id="comparison"></div>
    </article>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
